<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b09">
  <meta name="description" content="Temple — multiplayer art arena">
  <meta property="og:title" content="Temple">
  <meta property="og:description" content="多人線上藝術格鬥、探索與展示空間">
  <title>Temple</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="preload" href="./temple-assets/character.temple.glb" as="fetch" crossorigin>
  <link rel="preload" href="./temple-assets/coin_small.temple.glb" as="fetch" crossorigin>
  <script src="./temple-config.js"></script>
  <script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body class="booting">
  <canvas id="game" aria-label="Temple 3D game"></canvas>
  <div id="loading" role="status"><div class="temple-mark">T</div><p id="loading-label">TEMPLE IS FORMING</p><div class="loading-track"><i id="loading-fill"></i></div><small id="loading-detail">Preparing arena</small></div>

  <main id="entry" class="glass-card" aria-labelledby="entry-title">
    <p class="eyebrow">MULTIPLAYER ART ARENA</p><h1 id="entry-title">TEMPLE</h1>
    <p class="entry-copy">四名戰士與兩名觀眾，共享同一座會留下痕跡的藝術神殿。</p>
    <form id="entry-form">
      <label>玩家名稱<input id="player-name" name="name" maxlength="24" autocomplete="nickname" required placeholder="輸入名稱"></label>
      <label class="color-label">角色顏色<input id="player-color" name="color" type="color" value="#bde8dc"></label>
      <label>載入存檔碼（選填）<input id="save-code" name="saveCode" maxlength="4" pattern="[A-Za-z0-9]{4}" autocomplete="off" placeholder="AB3K"></label>
      <details><summary>連線設定</summary>
        <label>Temple Worker URL<input id="backend-url" type="url" spellcheck="false"></label>
        <label>GM 金鑰（不會儲存在頁面）<input id="admin-key" type="password" autocomplete="off"></label>
      </details>
      <button id="enter-button" type="submit">ENTER TEMPLE</button><p id="entry-error" role="alert"></p>
    </form>
  </main>

  <section id="hud" hidden>
    <div id="identity" class="hud-block"><strong id="hud-name">—</strong><span id="hud-role">FIGHTER</span></div>
    <div id="vitals" class="hud-block"><label>HP <progress id="hp" max="100" value="100"></progress><b id="hp-label">100</b></label><span id="wallet">0 COINS</span><span id="weapon">TIDE BLADE</span><span id="online">0 / 6</span></div>
    <div id="monster-hud" class="hud-block" hidden><small id="monster-name">MONSTER</small><progress id="monster-hp" max="100" value="100"></progress></div>
    <div id="crosshair"></div><div id="prompt"></div><div id="toast"></div>
    <div id="build-mode" hidden><small>BUILD PREVIEW</small><strong id="build-kind">STRUCTURE</strong><button id="build-rotate">R · ROTATE</button><button id="build-confirm">E · PLACE</button><button id="build-cancel">ESC · CANCEL</button></div>
    <nav id="dock" aria-label="遊戲功能">
      <button data-action="attack" title="Attack (J)"><b>J</b><span>攻擊</span></button>
      <button data-action="interact" title="Interact / throw (E)"><b>E</b><span>拾取</span></button>
      <button data-panel="bag"><b>B</b><span>背包</span></button>
      <button data-panel="shop"><b>I</b><span>商店</span></button>
      <button data-panel="build"><b>V</b><span>建造</span></button>
      <button data-action="fish"><b>F</b><span>釣魚</span></button>
      <button data-panel="social"><b>C</b><span>交流</span></button>
    </nav>
    <div id="mobile-stick" aria-hidden="true"><i></i></div>
  </section>

  <aside id="panel" class="glass-card" hidden aria-live="polite"><header><div><small id="panel-kicker">TEMPLE</small><h2 id="panel-title">PANEL</h2></div><button id="panel-close" aria-label="關閉">×</button></header><div id="panel-content"></div></aside>
  <div id="death" hidden><p>YOU FELL</p><strong id="respawn-count">5</strong><small>裝備保留，20% 金幣留在倒下的位置</small></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
