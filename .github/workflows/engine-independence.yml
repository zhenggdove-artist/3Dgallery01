name: Engine independence migration
on:
  push:
    branches: ['chore/independent-engine']
    paths:
      - 'scripts/independent-engine-migration.mjs'
      - '.github/workflows/engine-independence.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/independent-engine-migration.mjs
      - name: Validate migrated engine
        run: |
          npm run check
          npm test
          npm run build:cloud
          git diff --check
      - name: Publish validated candidate only to migration branch
        run: |
          git rm scripts/independent-engine-migration.mjs .github/workflows/engine-independence.yml
          git add -A
          git diff --cached --stat
          git -c user.name='GGTEMPLE maintenance' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Make gameplay engine paths self-contained'
          git push origin HEAD:refs/heads/chore/independent-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-independence-audit
          path: /tmp/engine-independence-report.json
          if-no-files-found: warn
