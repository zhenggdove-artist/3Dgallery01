name: Temple regression
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'tests/**'
      - '.github/workflows/temple-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'vendor/**'
      - 'cloudflare/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/temple-regression.yml'
  workflow_dispatch:

jobs:
  firebase-login-config-live:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production Google Auth config, CORS and profile readiness
        run: node tests/firebase-live-config.mjs
      - name: Diagnose production guest login backend version
        run: node tests/production-guest-probe.mjs

  firebase-google-login-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Start isolated browser + Worker for Google login regression
        run: |
          npx wrangler dev --local --port 8787 > /tmp/temple-login-worker.log 2>&1 &
          npm run start > /tmp/temple-login-static.log 2>&1 &
      - name: Test Google account selection, existing GM profile and new player entry
        run: node tests/temple-google-login-browser.mjs
      - name: Print login backend errors
        if: failure()
        run: |
          cat /tmp/temple-login-worker.log || true
          cat /tmp/temple-login-static.log || true

  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-bump.mjs
      - run: npm run check
      - run: npm test

  durable-object-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Boot ephemeral local Wrangler worker
        run: |
          npx wrangler dev --local --port 8787 --var TEMPLE_ADMIN_KEY:ci-only-smoke-secret > /tmp/temple-worker-ci.log 2>&1 &
          echo $! > /tmp/temple-worker-ci.pid
      - name: Validate actual room API, WRITE and artwork upload
        run: TEMPLE_TEST_ADMIN_KEY=ci-only-smoke-secret node tests/backend-smoke.mjs
      - name: Print server diagnostics if unsuccessful
        if: failure()
        run: cat /tmp/temple-worker-ci.log || true

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Boot isolated staging services
        run: |
          npx wrangler dev --local --port 8787 > /tmp/temple-browser-worker.log 2>&1 &
          npm run start > /tmp/temple-browser-static.log 2>&1 &
      - name: Run WebGL/browser end-to-end gameplay smoke
        run: node tests/temple-ui-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temple-ui-smoke-screenshots
          path: output/temple-ui-smoke
          if-no-files-found: ignore
      - name: Print browser server diagnostics if unsuccessful
        if: failure()
        run: |
          cat /tmp/temple-browser-worker.log || true
          cat /tmp/temple-browser-static.log || true

  support-y2k-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Start isolated SUPPORT staging servers
        run: |
          npx wrangler dev --local --port 8787 > /tmp/temple-support-worker.log 2>&1 &
          npm run start > /tmp/temple-support-static.log 2>&1 &
      - name: Verify actual Y2K SUPPORT desktop and mobile UI
        run: node tests/temple-y2k-support-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-y2k-desktop-mobile-screenshots
          path: output/support-y2k
          if-no-files-found: ignore
      - if: failure()
        run: |
          cat /tmp/temple-support-worker.log || true
          cat /tmp/temple-support-static.log || true

  safari-webkit-startup:
    # Playwright WebKit currently has no Ubuntu 26.04 binary.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Serve repository assets for WebKit
        run: npm run start > /tmp/temple-safari-static.log 2>&1 &
      - name: Verify actual Safari/WebKit module graph and 0% startup
        run: node tests/temple-safari-startup.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-boot-screenshot
          path: output/temple-safari-startup
          if-no-files-found: ignore
      - if: failure()
        run: cat /tmp/temple-safari-static.log || true

  mobile-touch-smoke:
    # Isolated worker/database for mobile A/E/scope; must not contaminate
    # the independent WRITE cinematic/browser game integration smoke.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Boot isolated mobile staging services
        run: |
          npx wrangler dev --local --port 8787 > /tmp/temple-mobile-worker.log 2>&1 &
          npm run start > /tmp/temple-mobile-static.log 2>&1 &
      - name: Verify iPhone-size touch controls and actual sniper scope
        run: node tests/temple-mobile-controls.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temple-mobile-scope-and-use
          path: output/temple-ui-smoke
          if-no-files-found: ignore
      - name: Print isolated mobile server diagnostics if unsuccessful
        if: failure()
        run: |
          cat /tmp/temple-mobile-worker.log || true
          cat /tmp/temple-mobile-static.log || true

  native-beam-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloud
      - name: Boot isolated backend and game assets
        run: |
          npx wrangler dev --local --port 8787 > /tmp/temple-beam-worker.log 2>&1 &
          npm run start > /tmp/temple-beam-static.log 2>&1 &
      - name: Probe actual GPU pixels of original 00GameDevs beams
        run: node tests/native-beam-visibility-browser.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-beam-diagnostic
          path: output/beam-visibility
          if-no-files-found: ignore
      - if: failure()
        run: |
          cat /tmp/temple-beam-static.log || true
          cat /tmp/temple-beam-worker.log || true
