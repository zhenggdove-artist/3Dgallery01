name: Temple regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/temple-regression.yml'
  workflow_dispatch:

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
