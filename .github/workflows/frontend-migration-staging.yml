name: Frontend migration staging (no production writes)
on:
  push:
    branches: [security/frontend-migration-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/security/frontend-migration-staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node frontend-migration/test-large.mjs
      - run: node frontend-migration/build.mjs
      - run: npm run check
      - run: npm test
      - name: Start local Pages and isolated backend, never use production credentials
        run: |
          node frontend-migration/transfer-large.mjs --local ggtemple-client-staging "$RUNNER_TEMP/ggtemple-pages-state"
          npx wrangler pages dev frontend-migration/.build/pages --port 8000 --r2 GGTEMPLE_LARGE_ASSETS=ggtemple-client-staging --persist-to "$RUNNER_TEMP/ggtemple-pages-state" --compatibility-date 2026-10-13 --config frontend-migration/wrangler.jsonc >/tmp/pages-migration.log 2>&1 &
          npm run build:cloud
          npx wrangler dev --local --port 8787 >/tmp/backend-migration.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null && curl -fsS http://127.0.0.1:8787/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pages-migration.log /tmp/backend-migration.log
          exit 1
      - name: Verify actual Pages asset delivery, hashes and private-file exclusion
        run: node frontend-migration/test-delivery.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: node tests/temple-safari-startup.mjs
      - run: node tests/temple-ui-smoke.mjs
      - run: node tests/temple-mobile-controls.mjs
      - if: failure()
        run: cat /tmp/pages-migration.log /tmp/backend-migration.log || true
