name: Retrieve official 00GameDevs Fireball #01
on:
  push:
    branches: [fix/ggtemple-official-fireball-01]
    paths: ['.github/workflows/fetch-ggtemple-fireball.yml']
permissions:
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 00GameDevs Fireball #01 original JavaScript
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/00gamedevs/source
          url="https://00gamedevs.com/downloads/effects/fireball.js"
          curl -fL --retry 2 --connect-timeout 10 --max-time 90 "$url" -o vendor/00gamedevs/source/fireball.js
          test "$(wc -c < vendor/00gamedevs/source/fireball.js)" -gt 10000
          grep -Eqi '(MIT|Copyright)' vendor/00gamedevs/source/fireball.js
          grep -q 'export default' vendor/00gamedevs/source/fireball.js
          node --check vendor/00gamedevs/source/fireball.js
          sha256sum vendor/00gamedevs/source/fireball.js
      - name: Commit untouched original into work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/00gamedevs/source/fireball.js
          git commit -m "Vendor byte-identical official 00GameDevs #01 Fireball"
          git push origin HEAD:fix/ggtemple-official-fireball-01
