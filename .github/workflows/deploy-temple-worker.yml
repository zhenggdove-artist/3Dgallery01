name: Deploy Temple Worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'temple-artwork-layout.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-temple-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temple-worker-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Worker NOT deployed: configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - run: npm run build:cloud
      - name: Deploy isolated Temple Durable Object Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production worker health
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 \
            https://temple-arena.zhenggdove-artist.workers.dev/health
