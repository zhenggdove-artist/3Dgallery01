name: Deploy Temple Worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'tests/**'
      - 'cloudflare/**'
      - 'wrangler.jsonc'
      - 'temple-artwork-layout.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-temple-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temple-worker-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-bump.mjs
      - run: npm run check
      - run: npm test
      - name: Validate Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare Worker NOT deployed: configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - run: npm run build:cloud
      - name: Deploy isolated Temple Durable Object Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production Worker protocol and artwork APIs
        run: |
          node --input-type=module <<'NODE'
          import {SHOP_CATALOG_REVISION, SHOP_CATALOG_IDS} from './src/shared/catalog.js';
          import {CITY_LAYOUT_SIGNATURE, CITY_BUILDING_COUNT} from './src/shared/city-layout.js';
          const url = 'https://temple-arena.zhenggdove-artist.workers.dev/health';
          const required = ['combatBuildingV082','castAlignmentV081','contextualSignArtV080','portraitSignsV079','signArtPaintV077','houseSignAllClearanceV075','houseSignClearanceV074','houseSignsV073','gmHouseV070','shopRelistV069','sessionChatV067','gmChatArchiveV067','artworkPromptPositionV067','shopRecallV066','discGraffitiV066','pickupAscensionV066','streetOutfitsV065','wantedPerimeterV062','terrainStyleV061','wantedStyleV060','wantedListV059','wantedBackgroundCropV058','wantedListV057','wantedListV056','bagStableDomV055','chatThreeStageV054','sustainedSpellBalanceV053','fireChannelContactV052','normalOnlySniperV051','scopeOnlySniperV050','restorativeGroundDropV049','qualitySkillScaling','muttonSignOutfit','linkedQualityTuning','independentRestorativeCooldowns','ultimateManaTuning','equipmentTuning', 'exponentialShotgun', 'multiWingContours', 'offlineWingGift', 'wingSaveReceipt', 'mana', 'shotgunDistanceFalloff', 'gmPlayerLevel', 'gmWingCanvas', 'restorativeCooldown', 'artMediaUpload', 'artBombPlace', 'gmReset', 'compactCombat', 'fastActionsV087', 'fastCastV089', 'instantAttackV090', 'guestLogin', 'artworkCoordinateRecovery', 'fighterOverflow', 'spectatorWrite', 'gmSpectatorPreview', 'bulkSell', 'wingScaleHandles', 'wingMultiAbility', 'personalWingDust'];
          let verified = false;
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const response = await fetch(url, {
                headers: { Accept: 'application/json' },
                signal: AbortSignal.timeout(10000)
              });
              if (!response.ok) throw new Error('Health HTTP ' + response.status);
              const health = await response.json();
              const missing = required.filter(feature => health.features?.[feature] !== true);
              if (missing.length) throw new Error('Missing production features: ' + missing.join(', '));
              if (health.apiVersion !== 7 || health.inventoryCapacity !== 3000 || health.features?.wearableCatalog !== SHOP_CATALOG_REVISION || health.cityLayoutSignature !== CITY_LAYOUT_SIGNATURE || health.cityBuildingCount !== CITY_BUILDING_COUNT || JSON.stringify(health.shopCatalogIds) !== JSON.stringify(SHOP_CATALOG_IDS)) throw new Error('Production catalog or inventory protocol is stale: ' + JSON.stringify(health));
              console.log('Production Temple Worker verified: '+SHOP_CATALOG_REVISION+' / '+SHOP_CATALOG_IDS.length+' purchasable item IDs / '+CITY_BUILDING_COUNT+' collision lots / '+CITY_LAYOUT_SIGNATURE);
              verified = true;
              break;
            } catch (error) {
              console.error('Health verification ' + attempt + '/6: ' + error.message);
              if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 3000));
            }
          }
          if (!verified) process.exitCode = 1;
          NODE
