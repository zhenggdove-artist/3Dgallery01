name: GGTEMPLE Regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'fidelity-ui.css'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ggtemple-regression.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
